sentence=Servo control for ESP32 boards: positional and continuous rotation servos with speed, easing and acceleration.
paragraph=Provides PositionalServo (angle, speed-limited non-blocking moves, easing, limits, trim, reverse) and ContinuousServo (speed in percent, acceleration ramps, timed runs, neutral calibration, dead band). Uses the ESP32 LEDC peripheral and supports Arduino-ESP32 core 2.x and 3.x on ESP32, S2, S3, C3, C6 and H2.
